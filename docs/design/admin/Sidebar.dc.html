<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tasuki — 左のメニュー</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="{{navLabel}}" style="{{vars}} box-sizing: border-box; width: 232px; padding: 14px 10px 20px; background: var(--panel); color: var(--text); font-family: Inter, 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; display: flex; flex-direction: column; gap: 2px">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 18px; color: var(--text); text-decoration: none">
    <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><rect width="28" height="28" rx="7" fill="var(--text)"></rect><path d="M7 9.5L20.5 23M11 5.5L22.5 17" stroke="var(--panel)" stroke-width="2.6" stroke-linecap="round"></path></svg>
    <span style="font-size: 15px; font-weight: 700; letter-spacing: -0.01em">Tasuki</span>
  </a>
  <sc-for list="{{items}}" as="it" hint-placeholder-count="8">
    <sc-if value="{{it.gap}}" hint-placeholder-val="{{ false }}"><div style="height: 1px; background: var(--line2); margin: 10px 8px"></div></sc-if>
    <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}} display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; text-decoration: none; font-size: 13.5px">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.d}}"></path></svg>
      <span style="flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{it.label}}</span>
      <sc-if value="{{it.badge}}" hint-placeholder-val="{{ false }}"><span aria-label="{{it.badgeLabel}}" style="display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: var(--accent); color: var(--onAccent); font-size: 11.5px; font-weight: 650">{{it.badge}}</span></sc-if>
    </a>
  </sc-for>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","requirements","prs","activity","questions","product","settings","system"],"default":"dashboard"},"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"lang":{"editor":"enum","options":["ja","en"],"default":"ja"},"$preview":{"width":232,"height":760}}'>
const THEMES = {
  light: '--bg:#F7F7F5;--panel:#FFFFFF;--sub:#F3F3F0;--hover:#EDEDE9;--line:#E4E4E0;--line2:#EDEDE9;--text:#18181B;--muted:#5A5A64;--faint:#686871;--accent:#4A52C6;--accentSoft:#EEEFFC;--onAccent:#FFFFFF;',
  dark: '--bg:#0D0D0F;--panel:#151518;--sub:#1C1C20;--hover:#222227;--line:#2A2A30;--line2:#222227;--text:#ECECEF;--muted:#A3A3AD;--faint:#8E8E98;--accent:#959CF5;--accentSoft:rgba(149,156,245,.13);--onAccent:#0D0D0F;'
};
const MENU = [
  { id: 'dashboard', href: 'Main.dc.html', ja: 'ダッシュボード', en: 'Dashboard', d: 'M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z' },
  { id: 'requirements', href: 'Requirements.dc.html', ja: '要件', en: 'Requirements', d: 'M5 21V4h12l-2 4 2 4H5' },
  { id: 'prs', href: 'PRs.dc.html', ja: 'PR とレビュー', en: 'Pull requests & reviews', d: 'M6 3a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM6 7v10M6 17a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM18 17a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM18 17V9a3 3 0 0 0-3-3h-4M13 4l-2 2 2 2', badge: 1 },
  { id: 'activity', href: 'Activity.dc.html', ja: '活動の履歴', en: 'Activity history', d: 'M3 12h4l3-8 4 16 3-8h4' },
  { id: 'questions', href: 'Questions.dc.html', ja: '質問', en: 'Questions', d: 'M4 5h16v11H9l-5 4zM9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .8-1 1.4M12 14.5v.01', badge: 1 },
  { id: 'product', href: 'Product.dc.html', ja: 'プロダクトの情報', en: 'Product knowledge', d: 'M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h7M8 11h5' },
  { id: 'settings', href: 'Settings.dc.html', ja: '設定', en: 'Settings', d: 'M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4', gap: true },
  { id: 'system', href: 'System.dc.html', ja: 'システム', en: 'System', d: 'M4 4h16v6H4zM4 14h16v6H4zM8 7h.01M8 17h.01' }
];
class Component extends DCLogic {
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const lang = this.props.lang ?? 'ja';
    const active = this.props.active ?? 'dashboard';
    const items = MENU.map((m) => {
      const on = m.id === active;
      return {
        href: m.href, d: m.d, label: m[lang], gap: !!m.gap, badge: m.badge || false,
        badgeLabel: lang === 'en' ? m.badge + ' need action' : '要対応 ' + m.badge + ' 件',
        current: on ? 'page' : 'false',
        style: on ? 'background:var(--hover);color:var(--text);font-weight:600;' : 'color:var(--muted);font-weight:500;'
      };
    });
    return { vars: THEMES[theme], items, navLabel: lang === 'en' ? 'Main menu' : 'メインメニュー' };
  }
}
</script>
</body>
</html>
