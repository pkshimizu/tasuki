<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Tasuki — 活動の履歴</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="{{vars}} display: flex; flex-wrap: wrap; min-height: 100vh; background: var(--bg); color: var(--text); font-family: Inter, 'Noto Sans JP', system-ui, sans-serif; font-size: 14px; line-height: 1.5">
  <div style="flex: 0 0 232px; background: var(--panel); border-right: 1px solid var(--line)">
    <dc-import name="Sidebar" active="activity" theme="{{theme}}" lang="ja" hint-size="232px,720px"></dc-import>
  </div>
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
    <dc-import name="AppHeader" theme="{{theme}}" lang="ja" status="running" hint-size="100%,56px"></dc-import>
    <main style="box-sizing: border-box; width: 100%; max-width: 1240px; padding: 28px 32px 64px; display: flex; flex-direction: column; gap: 24px">
      <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap">
        <h1 style="margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.01em">活動の履歴</h1>
        <span style="font-size: 13px; color: var(--faint)">Tasuki が何を見て、どう判断し、何をしたか</span>
      </div>
      <div role="tablist" aria-label="履歴の種類" style="display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap">
        <sc-for list="{{tabs}}" as="tb" hint-placeholder-count="3">
          <button type="button" role="tab" aria-selected="{{tb.sel}}" onClick="{{tb.pick}}" style="{{tb.style}} display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border: none; background: transparent; font: inherit; font-size: 13.5px; cursor: pointer; margin-bottom: -1px">{{tb.label}}<span style="font-size: 12px; color: var(--faint); font-weight: 500">{{tb.count}}</span></button>
        </sc-for>
      </div>

      <!-- 司令塔の判断 -->
      <sc-if value="{{isDec}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center; font-size: 12.5px; color: var(--muted)">
            <span>指示で絞り込み</span>
            <sc-for list="{{dirFilters}}" as="f" hint-placeholder-count="6"><button type="button" aria-pressed="{{f.on}}" style="{{f.style}} height: 28px; padding: 0 10px; border-radius: 14px; font: inherit; font-size: 12.5px; cursor: pointer">{{f.label}}</button></sc-for>
          </div>
          <div style="background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden">
            <div style="display: grid; grid-template-columns: 110px minmax(0, 1.3fr) minmax(0, 1fr) 28px; gap: 16px; padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--faint); background: var(--sub); border-bottom: 1px solid var(--line)"><span>日時</span><span>もとになった出来事</span><span>出した指示</span><span></span></div>
            <sc-for list="{{decs}}" as="d" hint-placeholder-count="5">
              <div style="border-bottom: 1px solid var(--line2)">
                <button type="button" aria-expanded="{{d.exp}}" onClick="{{d.toggle}}" style="{{d.rowStyle}} width: 100%; display: grid; grid-template-columns: 110px minmax(0, 1.3fr) minmax(0, 1fr) 28px; gap: 16px; align-items: start; padding: 12px 16px; border: none; font: inherit; color: var(--text); text-align: left; cursor: pointer">
                  <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px">{{d.at}}</span>
                  <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
                    <span style="font-size: 11.5px; color: var(--faint)">{{d.evCount}}</span>
                    <sc-for list="{{d.events}}" as="ev" hint-placeholder-count="1"><span style="font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ev}}</span></sc-for>
                  </span>
                  <span style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{d.dirs}}" as="x" hint-placeholder-count="1">
<span style="display: inline-flex; align-items: center; height: 24px; border-radius: 6px; border: 1px solid var(--line); overflow: hidden; font-size: 12px; max-width: 100%; background: var(--panel)">
<span style="{{x.labelStyle}} display: inline-flex; align-items: center; gap: 5px; height: 100%; padding: 0 8px; font-weight: 550; white-space: nowrap"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{x.d}}"></path></svg>{{x.label}}</span>
<span style="{{x.resStyle}} display: inline-flex; align-items: center; height: 100%; padding: 0 8px; border-left: 1px solid var(--line); white-space: nowrap; font-weight: 550">{{x.result}}</span>
</span>
</sc-for>
</span>
                  <svg style="{{d.chev}} margin-top: 4px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
                </button>
                <sc-if value="{{d.open}}" hint-placeholder-val="{{ false }}">
                  <div style="padding: 4px 16px 18px 142px; display: flex; flex-direction: column; gap: 14px; background: var(--panel)">
                    <div style="display: flex; flex-direction: column; gap: 6px">
                      <span style="font-size: 12px; font-weight: 600; color: var(--faint)">判断の理由</span>
                      <div style="{{d.mdBox}} position: relative; overflow: hidden; border-radius: 8px; background: var(--bg); border: 1px solid var(--line2); padding: 10px 14px">
                        <div style="display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.75; color: var(--text); text-wrap: pretty">
<sc-for list="{{d.md}}" as="b" hint-placeholder-count="3"><div style="{{b.style}}"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><span style="{{g.style}}">{{g.t}}</span></sc-for></div></sc-for>
</div>
                        <sc-if value="{{d.folded}}" hint-placeholder-val="{{ false }}"><div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(to bottom, transparent, var(--bg))"></div></sc-if>
                      </div>
                      <sc-if value="{{d.long}}" hint-placeholder-val="{{ false }}"><button type="button" onClick="{{d.fold}}" style="align-self: flex-start; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer">{{d.foldLabel}}</button></sc-if>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 6px">
                      <span style="font-size: 12px; font-weight: 600; color: var(--faint)">指示ごとの中身と結果</span>
                      <sc-for list="{{d.details}}" as="x" hint-placeholder-count="1">
                        <div style="{{x.box}} display: flex; flex-direction: column; gap: 4px; padding: 10px 14px; border-radius: 8px">
                          <span style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap"><span style="font-size: 13px; font-weight: 600">{{x.label}}</span><span style="{{x.resStyle}} display: inline-flex; align-items: center; height: 20px; padding: 0 7px; border-radius: 5px; font-size: 12px; font-weight: 600">{{x.result}}</span></span>
                          <span style="font-size: 13px; color: var(--muted); line-height: 1.65">{{x.note}}</span>
                        </div>
                      </sc-for>
                    </div>
                  </div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

      <!-- エージェントの実行 -->
      <sc-if value="{{isRun}}" hint-placeholder-val="{{ false }}">
        <div style="display: flex; flex-direction: column; gap: 12px">
          <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end">
            <sc-for list="{{runFilters}}" as="f" hint-placeholder-count="3">
              <label style="display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted)">{{f.label}}
                <select style="height: 32px; min-width: 150px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-size: 13px"><option>{{f.value}}</option></select>
              </label>
            </sc-for>
          </div>
          <div style="background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto">
            <div style="min-width: 860px">
              <div style="display: grid; grid-template-columns: 140px 120px 150px 96px 84px minmax(0, 1fr); gap: 14px; padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--faint); background: var(--sub); border-bottom: 1px solid var(--line)"><span>エージェント</span><span>対象</span><span>状態</span><span>開始</span><span>所要時間</span><span>要約</span></div>
              <sc-for list="{{runs}}" as="r" hint-placeholder-count="5">
                <div style="border-bottom: 1px solid var(--line2)">
                  <button type="button" aria-expanded="{{r.exp}}" onClick="{{r.toggle}}" style="{{r.rowStyle}} width: 100%; display: grid; grid-template-columns: 140px 120px 150px 96px 84px minmax(0, 1fr); gap: 14px; align-items: center; padding: 11px 16px; border: none; font: inherit; color: var(--text); text-align: left; cursor: pointer">
                    <span><span style="{{r.role.style}} display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.role.d}}"></path></svg>{{r.role.label}}</span></span>
                    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--muted); white-space: nowrap">{{r.target}}</span>
                    <span><span style="{{r.state.style}} display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 550; white-space: nowrap"><sc-if value="{{r.state.dot}}" hint-placeholder-val="{{ false }}"><span style="width: 6px; height: 6px; border-radius: 3px; background: currentColor"></span></sc-if>{{r.state.label}}</span></span>
                    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--muted)">{{r.at}}</span>
                    <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--muted)">{{r.dur}}</span>
                    <span style="font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.sum}}</span>
                  </button>
                  <sc-if value="{{r.open}}" hint-placeholder-val="{{ false }}">
                    <div style="padding: 4px 16px 18px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(340px, 100%), 1fr)); gap: 16px">
                      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
                        <span style="font-size: 12px; font-weight: 600; color: var(--faint)">指示書（司令塔が書いたもの）</span>
                        <div style="position: relative; max-height: 150px; overflow: hidden; border-radius: 8px; background: var(--bg); border: 1px solid var(--line2); padding: 10px 14px">
                          <div style="display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.75; color: var(--text); text-wrap: pretty">
<sc-for list="{{r.brief}}" as="b" hint-placeholder-count="3"><div style="{{b.style}}"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><span style="{{g.style}}">{{g.t}}</span></sc-for></div></sc-for>
</div>
                          <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: linear-gradient(to bottom, transparent, var(--bg))"></div>
                        </div>
                        <button type="button" style="align-self: flex-start; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); font: inherit; font-size: 12.5px">すべて表示（31 行）</button>
                      </div>
                      <div style="display: flex; flex-direction: column; gap: 6px; min-width: 0">
                        <span style="font-size: 12px; font-weight: 600; color: var(--faint)">結果の要約</span>
                        <div style="border-radius: 8px; background: var(--bg); border: 1px solid var(--line2); padding: 10px 14px"><div style="display: flex; flex-direction: column; gap: 3px; font-size: 13.5px; line-height: 1.75; color: var(--text); text-wrap: pretty">
<sc-for list="{{r.result}}" as="b" hint-placeholder-count="3"><div style="{{b.style}}"><sc-for list="{{b.segs}}" as="g" hint-placeholder-count="1"><span style="{{g.style}}">{{g.t}}</span></sc-for></div></sc-for>
</div></div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap; font-size: 12.5px">
                          <sc-for list="{{r.facts}}" as="fx" hint-placeholder-count="2"><span style="display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 7px; background: var(--sub); color: var(--muted)"><span style="color: var(--faint)">{{fx.k}}</span><span style="color: var(--text); font-weight: 550">{{fx.v}}</span></span></sc-for>
                        </div>
                      </div>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-if>

      <!-- 出来事 -->
      <sc-if value="{{isEv}}" hint-placeholder-val="{{ false }}">
        <div style="background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto">
          <div style="min-width: 760px">
            <div style="display: grid; grid-template-columns: 110px 170px minmax(0, 1fr) 130px; gap: 16px; padding: 9px 16px; font-size: 12px; font-weight: 600; color: var(--faint); background: var(--sub); border-bottom: 1px solid var(--line)"><span>日時</span><span>種類</span><span>内容</span><span>司令塔に渡した</span></div>
            <sc-for list="{{events}}" as="e" hint-placeholder-count="8">
              <div style="display: grid; grid-template-columns: 110px 170px minmax(0, 1fr) 130px; gap: 16px; align-items: start; padding: 11px 16px; border-bottom: 1px solid var(--line2)">
                <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 12.5px; color: var(--muted); padding-top: 2px">{{e.at}}</span>
                <span><span style="{{e.typeStyle}} display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 550; white-space: nowrap">{{e.type}}</span></span>
                <span style="font-size: 13px; line-height: 1.6">{{e.text}}</span>
                <span style="{{e.passStyle}} font-size: 12.5px; font-weight: 550; padding-top: 2px">{{e.pass}}</span>
              </div>
            </sc-for>
          </div>
        </div>
      </sc-if>

    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":1600}}'>
const THEMES = {
  light: '--bg:#F7F7F5;--panel:#FFFFFF;--sub:#F3F3F0;--hover:#EDEDE9;--line:#E4E4E0;--line2:#EDEDE9;--text:#18181B;--muted:#5A5A64;--faint:#686871;--accent:#4A52C6;--accentSoft:#EEEFFC;--onAccent:#FFFFFF;--ok:#15754A;--okSoft:#E3F2E9;--warn:#935000;--warnSoft:#FBEFDC;--err:#BA3027;--errSoft:#FBE7E5;--info:#2360BC;--infoSoft:#E7EFFB;--r-con:#4F51C4;--r-spec:#0A7268;--r-plan:#8F5C00;--r-ui:#AB2E76;--r-prog:#2360C0;--r-rev:#AE3D0B;--shadow:0 1px 2px rgba(16,16,20,.04);--pop:0 16px 40px rgba(16,16,20,.16);',
  dark: '--bg:#0D0D0F;--panel:#151518;--sub:#1C1C20;--hover:#222227;--line:#2A2A30;--line2:#222227;--text:#ECECEF;--muted:#A3A3AD;--faint:#8E8E98;--accent:#959CF5;--accentSoft:rgba(149,156,245,.13);--onAccent:#0D0D0F;--ok:#52C58E;--okSoft:rgba(82,197,142,.12);--warn:#E9A43F;--warnSoft:rgba(233,164,63,.13);--err:#F27C72;--errSoft:rgba(242,124,114,.13);--info:#72A8F6;--infoSoft:rgba(114,168,246,.13);--r-con:#9798F3;--r-spec:#40C7B6;--r-plan:#E2AD40;--r-ui:#EF80C2;--r-prog:#70A8F6;--r-rev:#F38D55;--shadow:0 0 0 transparent;--pop:0 18px 44px rgba(0,0,0,.55);'
};
const ROLES = {
  con: { ja: '司令塔', en: 'Conductor', c: '--r-con', d: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM15.5 8.5l-2 5-5 2 2-5z' },
  spec: { ja: '仕様マスター', en: 'Spec Master', c: '--r-spec', d: 'M7 3h7l4 4v14H7zM14 3v4h4M10 12h5M10 16h5' },
  plan: { ja: 'プランナー', en: 'Planner', c: '--r-plan', d: 'M10 6h10M10 12h10M10 18h10M4 6l1.5 1.5L8 5M4 12l1.5 1.5L8 11M4 18l1.5 1.5L8 17' },
  ui: { ja: 'UIデザイナー', en: 'UI Designer', c: '--r-ui', d: 'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 9h18M9 9v11' },
  prog: { ja: 'プログラマー', en: 'Programmer', c: '--r-prog', d: 'M8 8l-4 4 4 4M16 8l4 4-4 4M13.5 5l-3 14' },
  rev: { ja: 'レビュアー', en: 'Reviewer', c: '--r-rev', d: 'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z' }
};
const role = (k, lang) => { const r = ROLES[k]; return { label: r[lang], d: r.d, style: 'background:color-mix(in srgb,var(' + r.c + ') 13%,transparent);color:var(' + r.c + ');' }; };
const TONE = { ok: 'color:var(--ok);background:var(--okSoft);', warn: 'color:var(--warn);background:var(--warnSoft);', err: 'color:var(--err);background:var(--errSoft);', neutral: 'color:var(--muted);background:var(--sub);', plain: 'color:var(--muted);background:transparent;' };
const ICON = {
  wait: 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18zM12 7v5l3 2',
  bell: 'M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 20h4',
  merge: 'M6 3a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM6 7v14M18 13a2 2 0 1 0 0 4a2 2 0 1 0 0-4zM18 13c0-4-3-6-12-6'
};
const MONO = "font-family:'JetBrains Mono',ui-monospace,monospace;";
const chip = (k) => role(k, 'ja');
const CODE = MONO + 'font-size:.9em;background:var(--sub);border:1px solid var(--line2);padding:0 5px;border-radius:4px;';
const segs = (l) => l.split('`').map((t, i) => ({ t, style: i % 2 ? CODE : '' }));
const MD = (src) => src.split('\n').filter((l) => l.trim()).map((l) => {
  if (l.startsWith('### ')) return { segs: segs(l.slice(4)), style: 'font-weight:650;font-size:13px;margin-top:8px;' };
  if (/^\d+\. /.test(l)) return { segs: segs(l), style: 'padding-left:2px;' };
  if (l.startsWith('- ')) return { segs: segs('・' + l.slice(2)), style: 'padding-left:2px;' };
  if (l.startsWith('> ')) return { segs: segs(l.slice(2)), style: 'color:var(--muted);padding-left:10px;border-left:2px solid var(--line);' };
  return { segs: segs(l), style: '' };
});
const RUNST = {
  running: { label: '実行中', style: TONE.ok, dot: true },
  done: { label: '終えた', style: TONE.neutral },
  asked: { label: '人への質問を返した', style: 'color:var(--accent);background:var(--accentSoft);' },
  blocked: { label: '進められないと返した', style: TONE.warn },
  error: { label: 'エラー', style: TONE.err },
  limit: { label: '利用上限で終わった', style: TONE.warn },
  aborted: { label: '中断', style: TONE.neutral }
};
const st = (k) => ({ ...RUNST[k], dot: !!RUNST[k].dot });
const launchDir = (k, target, res) => ({ label: ROLES[k].ja + 'を起動（' + target + '）', d: ROLES[k].d, labelStyle: 'color:var(' + ROLES[k].c + ');', result: res || '起動した', resStyle: TONE.ok });
const DIR = {
  wait: { label: '待つ', d: ICON.wait, labelStyle: 'color:var(--muted);', result: '待った', resStyle: TONE.plain },
  notify: { label: 'お知らせ', d: ICON.bell, labelStyle: 'color:var(--muted);', result: '書いた', resStyle: TONE.ok },
  mergeSkip: (n) => ({ label: 'マージ（' + n + '）', d: ICON.merge, labelStyle: 'color:var(--muted);', result: '見送り', resStyle: TONE.warn })
};
const MARK = {
  event: 'background:var(--panel);border:2px solid var(--faint);',
  decision: 'background:var(--r-con);border:2px solid var(--r-con);',
  run: (k) => 'background:var(' + ROLES[k].c + ');border:2px solid var(' + ROLES[k].c + ');'
};
const tl = (items) => items.map((x, i) => ({
  date: '', meta: '', role: false, target: '', state: false, body: '', dirs: [], md: false, mdMore: '', last: i === items.length - 1, cardStyle: 'background:var(--panel);', ...x,
  hasDirs: !!(x.dirs && x.dirs.length), rail: i === items.length - 1 ? 'background:transparent;' : 'background:var(--line);'
}));

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'dec', open: { d1: true, d4: true }, unfold: {} }; }
  flip(key, id) { const o = { ...this.state[key] }; o[id] = !o[id]; this.setState({ [key]: o }); }
  renderVals() {
    const theme = this.props.theme ?? 'light';
    const { tab, open, unfold } = this.state;
    const tabs = [['dec', '司令塔の判断', '15'], ['run', 'エージェントの実行', '7'], ['ev', '出来事', '23']].map(([id, label, count]) => ({
      label, count, sel: tab === id ? 'true' : 'false', pick: () => this.setState({ tab: id }),
      style: tab === id ? 'color:var(--text);font-weight:650;border-bottom:2px solid var(--accent);' : 'color:var(--muted);font-weight:500;border-bottom:2px solid transparent;'
    }));
    const dirFilters = ['すべて', 'エージェントの起動', '人への質問', 'お知らせ', 'マージ', '要件の完了', '待つ', '見送りあり'].map((l, i) => ({ label: l, on: i ? 'false' : 'true', style: i ? 'border:1px solid var(--line);background:var(--panel);color:var(--muted);' : 'border:1px solid var(--text);background:var(--text);color:var(--panel);font-weight:600;' }));
    const okBox = 'background:var(--bg);border:1px solid var(--line2);';
    const skipBox = 'background:var(--warnSoft);border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);';
    const decRaw = [
      { id: 'd1', at: '今日 17:48', events: ['レビュアーが終えた（PR #19 · approve）'], dirs: [DIR.mergeSkip('PR #19')],
        md: '### 判断の理由\nPR #19 は 2 回目のレビューで approve になり、CI も合格している。\nマージの条件は満たしているので、マージを指示する。',
        details: [{ label: 'マージ（PR #19）', result: '見送り', resStyle: TONE.warn, box: skipBox, note: 'この工程のマージの設定は human です。人が GitHub でマージするのを待ちます' }] },
      { id: 'd2', at: '今日 17:45', events: ['CI の結果: PR #21 の e2e が実行中'], dirs: [DIR.wait],
        md: 'PR #21 は approve 済みだが CI の e2e が実行中。結果が出るまで待つ。', details: [{ label: '待つ', result: '待った', resStyle: TONE.neutral, box: okBox, note: '次の出来事（CI の結果）を待ちます' }] },
      { id: 'd3', at: '今日 17:14', events: ['PR #19 にコミットが足された'], dirs: [DIR.wait],
        md: 'PR #19 は仕様マスターが修正中。終了を待ってから再レビューを判断する。', details: [{ label: '待つ', result: '待った', resStyle: TONE.neutral, box: okBox, note: '仕様マスターの終了を待ちます' }] },
      { id: 'd4', at: '今日 17:10', events: ['仕様マスターが終えた（要件）', 'PR #19 が作られた'], dirs: [launchDir('rev', 'PR #19'), DIR.notify],
        md: '### 判断の理由\n仕様マスターが仕様の PR #19 を作って終えた。人への質問は無い。\n質問せずに決めた点が 6 つあるので、人がマージを判断しやすいようレビュアーに確認を指示する。\n### 確認してほしい点\n1. 次のカードへ進むきっかけ（裏をもう一度押す）\n2. ランダムの決め方（直前と同じカードを出さない）\n3. カードが 1 枚しかないときの表示\n4. カードが 0 枚のときの案内\n5. キーボード操作（Space で裏返す）\n6. 表示の切り替え時のアニメーション\n### お知らせの文面\n> 仕様の PR #19 を作りました。レビューが終わったらマージをお願いします。',
        details: [
          { label: 'レビュアーを起動（PR #19）', result: '起動した', resStyle: TONE.ok, box: okBox, note: '作業フォルダ read-pr-19 で起動。指示書 18 行' },
          { label: 'お知らせ', result: '書いた', resStyle: TONE.ok, box: okBox, note: '#notifications に投稿しました' }
        ] },
      { id: 'd5', at: '今日 16:52', events: ['新しい要件（kenji.shimizu）'], dirs: [launchDir('spec', '要件')], md: '新しい要件。まず仕様を書く。', details: [{ label: '仕様マスターを起動（要件）', result: '起動した', resStyle: TONE.ok, box: okBox, note: '作業フォルダ read-repo で起動' }] }
    ];
    const decs = decRaw.map((d) => {
      const isOpen = !!open[d.id]; const md = MD(d.md); const long = md.length > 6; const uf = !!unfold[d.id];
      const skip = d.dirs.some((x) => x.result === '見送り');
      return { ...d, md, open: isOpen, exp: isOpen ? 'true' : 'false', toggle: () => this.flip('open', d.id),
        evCount: '出来事 ' + d.events.length + ' 件',
        rowStyle: skip ? 'background:color-mix(in srgb,var(--warn) 5%,var(--panel));' : 'background:var(--panel);',
        chev: isOpen ? 'transform:rotate(180deg);' : '',
        long, folded: long && !uf, mdBox: long && !uf ? 'max-height:150px;' : '', fold: () => this.flip('unfold', d.id), foldLabel: uf ? '折りたたむ' : 'すべて表示（' + md.length + ' 行）' };
    });
    const runFilters = [{ label: 'エージェント', value: 'すべてのエージェント' }, { label: '状態', value: 'すべての状態' }, { label: '対象', value: 'すべての対象' }];
    const runRaw = [
      { id: 'r1', role: chip('rev'), target: 'PR #19', state: st('running'), at: '17:51', dur: '1:05〜', sum: '仕様の PR #19 を確かめている', result: '（実行中）', facts: [{ k: '作業フォルダ', v: 'read-pr-19' }] },
      { id: 'r2', role: chip('prog'), target: 'Issue #20', state: st('running'), at: '17:48', dur: '4:12〜', sum: 'PR #21 の指摘 #1・#2 を直している', result: '（実行中）', facts: [{ k: '作業フォルダ', v: 'issue-20' }] },
      { id: 'r3', role: chip('prog'), target: 'Issue #20', state: st('done'), at: '17:32', dur: '5:52', sum: '実装して PR #21 を作った。手元で format・lint・typecheck・test（72 件）・build・受け入れテスト（44 件）が合格',
        result: '実装して PR #21 を作った。\n- 手元で format・lint・typecheck・test（72 件）・build・受け入れテスト（44 件）が合格\n- e2e は `e2e/flashcards.spec.ts` に 6 件を追加', facts: [{ k: '作成した PR', v: '#21' }, { k: '返した質問', v: 'なし' }] },
      { id: 'r4', role: chip('plan'), target: 'リポジトリ全体', state: st('done'), at: '17:18', dur: '2:07', sum: 'Issue #20 を 1 件作った', result: 'Issue #20 を 1 件作った。', facts: [{ k: '作成した Issue', v: '#20' }] },
      { id: 'r5', role: chip('rev'), target: 'PR #19', state: st('done'), at: '17:10', dur: '2:19', sum: '判定 request_changes、指摘 major 3', result: '判定は request_changes。\n- major 3 件（仕様の書き漏れ）', facts: [{ k: '判定', v: 'request_changes' }, { k: '指摘', v: 'major 3' }] },
      { id: 'r6', role: chip('spec'), target: '要件', state: st('done'), at: '17:06', dur: '2:05', sum: 'カードモードの仕様を docs/specs/flashcards.md に書き、PR #19 を作成した。人への質問は無し。',
        result: 'カードモードの仕様を `docs/specs/flashcards.md` に書き、PR #19 を作成した。人への質問は無し。\n### 質問せずに決めたこと\n1. 次のカードへ進むきっかけ…\n2. ランダムの決め方…', facts: [{ k: '作成した PR', v: '#19' }, { k: '返した質問', v: 'なし' }] }
    ];
    const brief = MD('### やること\nIssue #20 の受け入れ条件を満たすカードモードを `/flashcards` に実装する。\n### 守ること\n- 仕様は `docs/specs/flashcards.md` に従う\n- e2e は既存の `/quiz` と同じ書き方にする\n- 各テストの最初にテスト用のカードを作る\n### 終えるとき\nPR を作り、手元で通したチェックを要約に書く。');
    const runs = runRaw.map((r) => ({ ...r, brief, result: MD(r.result), open: !!open[r.id], exp: open[r.id] ? 'true' : 'false', toggle: () => this.flip('open', r.id), rowStyle: 'background:var(--panel);' }));
    const T = (t) => ({ '新しい要件': 'color:var(--accent);background:var(--accentSoft);', '質問への返信': 'color:var(--accent);background:var(--accentSoft);', 'マージの見送り': TONE.warn, 'CI の結果': TONE.neutral }[t] || TONE.neutral);
    const events = [
      ['今日 17:51', 'エージェントの終了', 'なし（実行中のため該当なし）', false],
      ['今日 17:48', 'マージの見送り', 'PR #19: この工程のマージの設定は human', false],
      ['今日 17:47', 'エージェントの終了', 'レビュアー（PR #19）が終えた · approve', true],
      ['今日 17:45', 'CI の結果', 'PR #21: e2e が実行中（lint・typecheck・unit は合格）', true],
      ['今日 17:38', 'PR の変化', 'PR #21 が作られた「feat: カードモードを追加する」', true],
      ['今日 17:20', 'Issue の変化', 'Issue #20 が作られた「カードモードを追加する」', true],
      ['今日 17:14', 'PR の変化', 'PR #19 にコミットが 1 件足された', true],
      ['今日 17:08', '仕様・デザインの変更', 'docs/specs/flashcards.md が追加された（PR #19）', true],
      ['今日 16:52', '新しい要件', 'kenji.shimizu「カードを一枚ずつランダムに表示し…」', true],
      ['今日 09:00', '利用上限からの回復', '利用上限が解除され、確認を再開した', false]
    ].filter((e) => e[2].indexOf('該当なし') < 0).map(([at, type, text, pass]) => ({ at, type, text, typeStyle: T(type), pass: pass ? '渡した' : '渡していない', passStyle: pass ? 'color:var(--text);' : 'color:var(--faint);' }));
    return { vars: THEMES[theme], theme, tabs, isDec: tab === 'dec', isRun: tab === 'run', isEv: tab === 'ev', dirFilters, decs, runFilters, runs, events };
  }
}
